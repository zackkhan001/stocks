name: Update market data
on:
  schedule:
    - cron: "*/20 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python update_prices.py
      - run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add market_data.json
          git commit -m "Update market data" || exit 0
          git push
